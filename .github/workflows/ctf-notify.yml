name: CTFtime Discord Notifier

on:
  schedule:
    # Runs every 30 minutes so "starting soon" and "live now" alerts are timely.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run notifier
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFY_WINDOW_DAYS: "1"
          REMINDER_MINUTES: "60"
          MENTION_MODES: "upcoming,soon,live"
        run: python ctftime_notifier.py

      - name: Commit updated state file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notified_ids.json
          git diff --cached --quiet || git commit -m "Update notified CTF ids"
          git push
